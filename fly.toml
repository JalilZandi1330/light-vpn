app = "light-vpn"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  SS_METHOD = "2022-blake3-aes-128-gcm"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3000
    handlers = []

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500
